[package]
name = "move-core-types"
version = "0.0.4"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = ["crates-io"]
description = "Core types for Move"

[dependencies]
# external dependencies
anyhow.workspace = true
arbitrary = { workspace = true, optional = true }
bcs.workspace = true
ethnum.workspace = true
hex.workspace = true
leb128.workspace = true
num.workspace = true
once_cell.workspace = true
primitive-types.workspace = true
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
rand.workspace = true
ref-cast.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_with.workspace = true
thiserror.workspace = true
uint.workspace = true

# internal dependencies
enum-compat-util.workspace = true
iota-sdk-types = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "77bf207d4a0000db8ac9f5d8e51e9e108f7235c7", features = ["rand", "proptest"] }
move-proc-macros.workspace = true

[dev-dependencies]
regex.workspace = true
serde_json.workspace = true

[features]
default = []
fuzzing = ["proptest", "proptest-derive", "arbitrary"]

[package.metadata.cargo-udeps.ignore]
normal = ["enum-compat-util"]
