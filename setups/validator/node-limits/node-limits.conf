# Values for node-limits.sh: connection limits per client address for the TCP
# ports of a validator. A limit is per IPv4 address or per IPv6 /64. A new
# connection over the limit gets a TCP reset at its first packet.
#
#   limit <port> <connections>
#       Limit for every client address on this port. 0 means no limit.
#   override <port> <network> <connections>
#       Limit for each address in this network, instead of the limit above.
#       The longest prefix wins. 0 means no limit. Use it, for example, for
#       your own fullnodes behind one NAT address or for a load balancer.
#   loopback <connections>
#       Limit for 127.0.0.0/8 and ::1, on every port above. 0 means no limit.
#       Clients in local containers do not use loopback addresses.
#   handshake-timeout <seconds>
#       How long a connection that has not finished its TCP handshake counts.
#
# Lines that start with # are comments.

# Validator gRPC interface.
limit 8080 16
loopback 1024
handshake-timeout 5

# override 8080 203.0.113.0/24 64
