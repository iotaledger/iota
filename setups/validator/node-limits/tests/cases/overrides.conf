# Two ports, nested IPv4 and IPv6 overrides in mixed order, bare addresses and
# an override of 0. The rules must list the longest prefix first.
limit 8080 16
limit 9090 8
override 8080 10.0.0.0/8 64
override 8080 2001:db8::/32 32
override 8080 10.1.0.0/16 0
override 8080 2001:db8:1::/48 0
override 8080 10.1.2.3 6
override 8080 2001:db8:1::5 2
override 9090 192.0.2.0/24 4
loopback 1024
handshake-timeout 5
