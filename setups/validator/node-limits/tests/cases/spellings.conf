# Other spellings of networks. The rules must have the networks as nft writes them.
limit 8080 16
override 8080 2001:0DB8:0000::1 2
override 8080 2001:db8:0:1:0:0:0:0/64 3
override 8080 fd00::/8 4
override 8080 ::/0 5
override 8080 1:0:0:2:0:0:0:3 6
override 8080 192.0.2.7 7
loopback 1024
handshake-timeout 5
