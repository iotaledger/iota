# The fullnode compose file before HAProxy, for the upgrade check of run.sh.
services:
  fullnode:
    image: iotaledger/iota-node:_network_placeholder_
    ports:
      - "8084:8084/udp"
      - "9000:9000/tcp"
      - "9184:9184/tcp"
    volumes:
      - ./data:/opt/iota/:rw
    command: [
      "/usr/local/bin/iota-node",
      "--config-path",
      "/opt/iota/config/fullnode.yaml",
    ]
