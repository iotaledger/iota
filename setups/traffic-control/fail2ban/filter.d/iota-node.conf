# fail2ban filter for the line an IOTA node logs when it blocks a client:
#
#   client_blocked client=<ip> reason=<spam|error> ttl_secs=<n>
#
# For an IPv6 client, <ip> is the network the node blocks, such as
# 2001:db8:1:2::/64. <SUBNET> matches both forms, and fail2ban bans the whole
# network; `action.d/nftables.local` lets its nftables actions do so.
#
# Both expressions match the line only from its start and under the
# `iota_node::client_blocked` target, so text a client gets into another
# log line cannot ban an address. The first matches the plain-text log, read
# from the journal or from a file; the second the JSON log (`RUST_LOG_JSON`).

[Definition]

_journal = (?:\S+ [\w.-]+(?:\[\d+\])?: (?:\d{4}-\d\d-\d\dT[\d:.]+Z)?)?

failregex = ^%(_journal)s\s+INFO iota_node::client_blocked: client_blocked client=<SUBNET> reason=[a-z]+ ttl_secs=\d+$
            ^(?:\S+ [\w.-]+(?:\[\d+\])?: )?\{"timestamp":"[^"]*","level":"INFO","fields":\{"message":"client_blocked client=<SUBNET> reason=[a-z]+ ttl_secs=\d+"\},"target":"iota_node::client_blocked"

ignoreregex =

journalmatch = _SYSTEMD_UNIT=iota-node.service
