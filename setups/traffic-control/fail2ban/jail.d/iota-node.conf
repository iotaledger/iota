# fail2ban jail that bans every client the IOTA node blocks, on the ports that
# serve clients. Keep only the ports your node uses, and set `bantime` to the
# node's `connection-blocklist-ttl-sec` (60 seconds by default).

[iota-node]
enabled   = true
filter    = iota-node
backend   = systemd
maxretry  = 1
findtime  = 1m
bantime   = 60
port      = 8080,9000,50051
protocol  = tcp
banaction = nftables-multiport
