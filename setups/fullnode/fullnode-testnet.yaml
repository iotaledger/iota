---
# Database Configuration
# Important: update this value to the location you want IOTA to store its database
db-path: "/opt/iota/db/authorities_db"

# Genesis Configuration
# Important: update this to the location where the genesis file is stored
genesis:
  genesis-file-location: "/opt/iota/config/genesis.blob"

# Pruning Configuration (see https://docs.iota.org/operator/full-node/configs/pruning)
authority-store-pruning-config:
  # Use 18446744073709551615 to disable object versions pruning
  num-epochs-to-retain: 1
  # Use 18446744073709551615 to disable transaction pruning
  num-epochs-to-retain-for-checkpoints: 2

# Network Configuration
# This address is also used for web socket connections
json-rpc-address: "0.0.0.0:9000"
p2p-config:
  listen-address: "0.0.0.0:8084"
  external-address: /dns/$HOSTNAME/udp/8084 # Important: update this to your external DNS address
  seed-peers:
    - address: /dns/access-0.r.testnet.iota.cafe/udp/8084
      peer-id: 46064108d0b689ed89d1f44153e532bb101ce8f8ca3a3d01ab991d4dea122cfc
    - address: /dns/access-1.r.testnet.iota.cafe/udp/8084
      peer-id: 8ffd25fa4e86c30c3f8da7092695e8a103462d7a213b815d77d6da7f0a2a52f5

# State Sync Checkpoint Archive Fallback
checkpoint-archive-config:
  url: "https://checkpoints.testnet.iota.cafe/ingestion/historical"
  download-concurrency: 5

# Traffic control. The node reads the client address from the x-forwarded-for
# header, which HAProxy (docker/haproxy) writes. Only HAProxy may connect to
# the JSON-RPC port of the node. This also applies to the gRPC API
# (enable-grpc-api): if you enable it, do not publish its port, or put it
# behind a proxy that writes this header. A policy-config block replaces the
# whole default policy, so this block writes out all of it.
policy-config:
  client-id-source:
    x-forwarded-for: 1
  spam-policy-type:
    freq-threshold:
      client-threshold: 1000
      burst-secs: 5
  error-policy-type:
    freq-threshold:
      client-threshold: 50
      burst-secs: 5
  spam-sample-rate: 1.0
  dry-run: true

# Set the exposure level for each Prometheus metric group. The values below
# are the defaults; omitting a group (or this whole section) is the same as
# writing them out.
# metrics:
#   groups:
#     default: info # metrics whose module belongs to no group
