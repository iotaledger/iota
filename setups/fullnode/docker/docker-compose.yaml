services:
  fullnode:
    image: iotaledger/iota-node:_network_placeholder_
    ports:
      - "8084:8084/udp" # P2P port
      - "127.0.0.1:9184:9184/tcp" # Metrics port, this host only
    # The JSON-RPC port (9000) is reached through the haproxy service only.
    volumes:
      - ./data:/opt/iota/:rw
    #environment:
    #  # activate jemalloc's heap profiler with the following settings:
    #  #  - "prof_prefix:/opt/iota/profiles/memory/node" - writes heap profiles with the prefix "node"
    #  #  - "prof_final:true" - writes a final heap profile on exit
    #  #  - "lg_prof_interval:30" - to write a heap profile every 2^30 bytes (1GB) of allocated memory
    #  #  - "prof_sample:19" - samples 1 out of 2^19 allocations for the heap profile, which is a good balance between overhead and detail.
    #  - MALLOC_CONF=prof:true,prof_active:true,prof_prefix:/opt/iota/profiles/memory/node,prof_final:true,lg_prof_interval:30,lg_prof_sample:19
    command: [
      "/usr/local/bin/iota-node",
      "--config-path",
      "/opt/iota/config/fullnode.yaml",
    ]

  # JSON-RPC port with connection limits per client address and timers. See
  # haproxy/haproxy.cfg.
  haproxy:
    image: haproxy:3.4.7-alpine
    ports:
      - "9000:9000/tcp" # JSON-RPC port
      - "127.0.0.1:8404:8404/tcp" # HAProxy metrics port, this host only
    environment:
      - IOTA_JSONRPC_SERVER=fullnode:9000
      - IOTA_HAPROXY_METRICS_ADDRESS=0.0.0.0:8404
    volumes:
      # Without the haproxy directory, "up" fails and does not start HAProxy
      # with an empty directory.
      - type: bind
        source: ./haproxy
        target: /usr/local/etc/haproxy
        read_only: true
        bind:
          create_host_path: false
    networks:
      default: {}
      # The published ports use this network, so HAProxy sees the IPv6
      # address of a client.
      dual-stack:
        gw_priority: 1
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

networks:
  # The fullnode stays on the default network, which has IPv4 only. If its
  # network had IPv6, Docker would send IPv6 traffic for the P2P port to the
  # IPv6 address of the container, where the node does not listen.
  dual-stack:
    enable_ipv6: true
