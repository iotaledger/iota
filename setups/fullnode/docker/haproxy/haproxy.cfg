# HAProxy in front of the JSON-RPC port (9000) of an IOTA fullnode. It serves
# HTTP/1.1, HTTP/2 without TLS (h2c) and WebSocket. Environment variables:
#   IOTA_JSONRPC_SERVER           JSON-RPC listener of the node (default 127.0.0.1:9001)
#   IOTA_HAPROXY_METRICS_ADDRESS  Prometheus metrics of HAProxy (default 127.0.0.1:8404)
global
    log stdout format raw local0 info
    maxconn 20000
    # After a reload, the old process closes its last connections after this time.
    hard-stop-after 2h
    # Admin socket, for example to change limits_9000.map without a reload.
    stats socket /tmp/admin.sock mode 600 level admin
    # One buffer of this size holds a whole request body while HAProxy waits for it.
    tune.bufsize.large 1310720
    # Requests at the same time on one HTTP/2 connection. This is equal to the
    # default limit of requests in progress per client address below. That
    # limit counts the requests of all connections of the address, so a client
    # that obeys this setting does not get 429 while it has no other requests
    # in progress.
    tune.h2.fe.max-concurrent-streams 64
    tune.h2.fe.glitches-threshold 1000

# Docker DNS. HAProxy finds the node again after the node container restarts.
resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Log errors and refused connections only.
    option dontlog-normal
    timeout connect 5s
    # HAProxy closes a connection when it cannot send a response to the client for this long.
    timeout client 60s
    timeout server 330s
    # Time for the first request and for each complete block of request headers.
    timeout http-request 10s
    # Idle time between requests. HTTP/2 PINGs are not requests.
    timeout http-keep-alive 300s
    # WebSocket connections after the upgrade.
    timeout tunnel 1h
    timeout client-fin 30s
    timeout server-fin 30s
    timeout queue 30s
    # HAProxy sends its own errors as JSON-RPC errors. For a POST request the
    # HTTP status becomes 200 (see http-after-response below), because
    # JSON-RPC clients read the body of a 2xx response only. Code -32050 (502,
    # 504) says that the node can still execute the request: when the Rust SDK
    # waits for the local execution of a transaction, it then looks for the
    # transaction instead of failing at once. With a 503, HAProxy did not send
    # the request to the node, so the code is -32009 (busy) and the client
    # gets the error at once.
    http-error status 413 content-type application/json lf-string '{"jsonrpc":"2.0","id":%[var(txn.rpcid,null)],"error":{"code":-32600,"message":"Request body too large"}}' hdr x-proxy-error 1
    http-error status 429 content-type application/json lf-string '{"jsonrpc":"2.0","id":%[var(txn.rpcid,null)],"error":{"code":-32009,"message":"Too many requests"}}' hdr x-proxy-error 1
    http-error status 502 content-type application/json lf-string '{"jsonrpc":"2.0","id":%[var(txn.rpcid,null)],"error":{"code":-32050,"message":"The node did not send a valid response; the request can still be executed"}}' hdr x-proxy-error 1
    http-error status 503 content-type application/json lf-string '{"jsonrpc":"2.0","id":%[var(txn.rpcid,null)],"error":{"code":-32009,"message":"The node is not available"}}' hdr x-proxy-error 1
    http-error status 504 content-type application/json lf-string '{"jsonrpc":"2.0","id":%[var(txn.rpcid,null)],"error":{"code":-32050,"message":"The node did not answer in time; the request can still be executed"}}' hdr x-proxy-error 1

backend st_total_9000
    stick-table type integer size 1 expire 2m store gpc(1),gpc_rate(1,1m)
backend st_conn_9000
    stick-table type ipv6 size 200k expire 30m store conn_cur,gpc(1),gpc_rate(1,1m)
backend st_req_9000
    stick-table type ipv6 size 200k expire 30m store conn_cur

frontend jsonrpc
    bind 0.0.0.0:9000
    bind :::9000 v6only
    maxconn 20000
    # A load balancer in proxy_protocol.lst sends the PROXY protocol header.
    # The limits per client address then use the client address in it.
    acl from_balancer src -f /usr/local/etc/haproxy/proxy_protocol.lst
    tcp-request connection expect-proxy layer4 if from_balancer
    tcp-request connection set-var(sess.balancer) bool(true) if from_balancer
    # Connection limits. HAProxy resets a refused connection right after the
    # accept, before it reads a byte. It logs a refusal when the same limit had
    # no other refusal in the last minute.
    # Total for this port.
    acl port_full fe_conn gt 10000
    tcp-request connection track-sc2 int(0) table st_total_9000 if port_full
    tcp-request connection sc-inc-gpc(0,2) if port_full
    tcp-request connection do-log if port_full { sc_gpc_rate(0,2,st_total_9000) eq 1 }
    tcp-request connection reject if port_full
    # Per client address: an IPv4 address or an IPv6 /64. limits_9000.map
    # changes the limit for a network; 0 means no limit.
    tcp-request connection set-var(sess.limit) src,map_ip_int(/usr/local/etc/haproxy/limits_9000.map,64) if !from_balancer
    tcp-request connection track-sc0 src,ipmask(32,64) table st_conn_9000 if !from_balancer
    acl limit_on var(sess.limit) -m int gt 0
    acl over_limit sc0_conn_cur(st_conn_9000),sub(sess.limit) gt 0
    tcp-request connection sc-inc-gpc(0,0) if limit_on over_limit
    tcp-request connection do-log if limit_on over_limit { sc_gpc_rate(0,0,st_conn_9000) eq 1 }
    tcp-request connection reject if limit_on over_limit
    # HTTP/1 connection age: 1620 to 1979 s (30 min +-10 %). The first response
    # after this time has "Connection: close".
    tcp-request connection set-var(sess.born) date
    tcp-request connection set-var(sess.age) rand(360),add(1620)
    # The same limit for a connection from a load balancer, after HAProxy has
    # read the PROXY header. HAProxy closes a refused connection.
    acl via_balancer var(sess.balancer) -m bool
    tcp-request session set-var(sess.limit) src,map_ip_int(/usr/local/etc/haproxy/limits_9000.map,64) if via_balancer
    tcp-request session track-sc0 src,ipmask(32,64) table st_conn_9000 if via_balancer
    tcp-request session sc-inc-gpc(0,0) if via_balancer limit_on over_limit
    tcp-request session do-log if via_balancer limit_on over_limit { sc_gpc_rate(0,0,st_conn_9000) eq 1 }
    tcp-request session reject if via_balancer limit_on over_limit
    # For the CORS header on HAProxy's own errors, as the node sends it.
    http-request set-var(txn.origin) req.hdr(origin)
    # Requests in progress per client address, counted before HAProxy waits
    # for the request body. The limit is the value of limits_9000.map. A
    # WebSocket counts as a connection, not as a request in progress.
    acl websocket hdr(upgrade) -i websocket
    http-request track-sc1 src,ipmask(32,64) table st_req_9000 unless websocket
    http-request deny deny_status 429 if limit_on { sc1_conn_cur(st_req_9000),sub(sess.limit) gt 0 }
    # Request body: the node gets a whole body or nothing.
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }
    http-request wait-for-body time 10s use-large-buffer
    http-request deny deny_status 413 if { req.body_len gt 1048576 }
    # Client address for the node. HAProxy keeps a received x-forwarded-for
    # header only from the networks in trusted_proxies.lst, then appends the
    # address of the peer.
    http-request del-header x-forwarded-for unless { src -f /usr/local/etc/haproxy/trusted_proxies.lst }
    option forwardfor
    # The JSON-RPC request id, for the error responses above: a JSON number as
    # it is, any other value as a JSON string, null if HAProxy cannot write it.
    acl id_number var(txn.rpcid) -m reg ^-?(0|[1-9][0-9]*)$
    http-request set-var(txn.rpcid) req.body,json_query('$.id','int') if { req.body_len gt 0 }
    http-request set-var(txn.rpcstr) var(txn.rpcid),json(utf8s) if { var(txn.rpcid) -m found } !id_number
    http-request unset-var(txn.rpcid) if { var(txn.rpcid) -m found } !id_number !{ var(txn.rpcstr) -m found }
    http-request set-var-fmt(txn.rpcid) '"%[var(txn.rpcstr)]"' if { var(txn.rpcstr) -m found }
    http-after-response set-status 200 if { res.hdr(x-proxy-error) -m found } METH_POST
    http-after-response set-header access-control-allow-origin "*" if { res.hdr(x-proxy-error) -m found } { var(txn.origin) -m found }
    http-after-response del-header x-proxy-error
    http-after-response set-header connection close if { date,sub(sess.born),sub(sess.age) gt 0 } !{ status 101 }
    use_backend node_websocket if websocket
    default_backend node_jsonrpc

# HAProxy talks HTTP/1.1 to the node, so each request in progress uses one
# connection to the node, and each WebSocket uses one for as long as it is
# open. maxconn on the server lines bounds these connections. The global
# maxconn counts client connections only.
#
# Requests: 1000 at the same time. A request over the limit waits up to
# "timeout queue" (30 s), then gets the 503 error.
backend node_jsonrpc
    server node "${IOTA_JSONRPC_SERVER-127.0.0.1:9001}" maxconn 1000 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

# WebSockets have their own limit, so that open subscriptions do not take the
# connections of requests. The node allows 100 subscriptions by default
# (indexer-max-subscriptions), so 200 WebSockets also leave room for
# WebSockets without a subscription. A WebSocket over the limit waits at most
# 1 s, then gets HTTP 503 with a JSON-RPC error. A WebSocket upgrade is a GET
# request, so the status stays 503.
backend node_websocket
    timeout queue 1s
    http-error status 503 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32009,"message":"No WebSocket connection to the node is free"}}'
    server node "${IOTA_JSONRPC_SERVER-127.0.0.1:9001}" maxconn 200 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

frontend prometheus
    bind "${IOTA_HAPROXY_METRICS_ADDRESS-127.0.0.1:8404}"
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
