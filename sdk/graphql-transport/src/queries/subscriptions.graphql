subscription subscribeEvents($filter: SubscriptionEventFilter) {
    events(filter: $filter) {
        ... on Event {
            ...RPC_EVENTS_FIELDS
        }
        ... on Lagged {
            count
        }
    }
}

subscription subscribeTransactions(
    $filter: SubscriptionTransactionFilter
    $showBalanceChanges: Boolean = false
    $showEffects: Boolean = false
    $showRawEffects: Boolean = false
    $showEvents: Boolean = false
    $showInput: Boolean = false
    $showObjectChanges: Boolean = false
    $showRawInput: Boolean = false
) {
    transactions(filter: $filter) {
        ... on TransactionBlock {
            ...RPC_TRANSACTION_FIELDS
        }
        ... on Lagged {
            count
        }
    }
}
