# DAG Visualizer overlay for iota-private-network.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.dag-viz.yaml up
#
# This rebuilds validator-1 from source with the dag-visualizer feature,
# enables gRPC streaming on port 9185, and adds the dag-visualizer stack
# (server + frontend + Traefik) accessible at http://localhost:${DAG_VIZ_PORT:-80}.
#
# First run will take a while to build the Rust binary. Subsequent runs
# use Docker layer caching.

services:
  # Override validator-1: build from source with dag-visualizer feature
  validator-1:
    build:
      context: ../../
      dockerfile: docker/iota-node/Dockerfile
      args:
        CARGO_BUILD_FEATURES: dag-visualizer
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=info,iota_core=debug,iota_network=debug,iota_node=debug,jsonrpsee=error
      - RPC_WORKER_THREAD=12
      - NEW_CHECKPOINT_WARNING_TIMEOUT_MS=30000
      - NEW_CHECKPOINT_PANIC_TIMEOUT_MS=60000
      - CONSENSUS_PROTOCOL=${CONSENSUS_PROTOCOL:-}
      - DAG_VISUALIZER_PORT=9185
      - DAG_VISUALIZER_GRPC_ADDRESS=0.0.0.0

  # DAG visualizer backend — connects to validator-1's gRPC stream
  dag-visualizer-server:
    image: iotaledger/dag-visualizer-server
    build:
      context: ../../
      dockerfile: dev-tools/dag-visualizer/server/Dockerfile
    container_name: dag-visualizer-server
    hostname: dag-visualizer-server
    ports:
      - "9286:9186"
    networks:
      iota-network:
        ipv4_address: 10.0.0.50
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dag-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.dag-api.entrypoints=web"
      - "traefik.http.services.dag-api.loadbalancer.server.port=9186"
    command:
      - "--validator-grpc-address=http://10.0.0.11:9185"
      - "--webserver-address=0.0.0.0:9186"
      - "--data-dir=/app/data"
      - "--max-epochs=${MAX_EPOCHS:-2}"
      - "--log-level=${LOG_LEVEL:-info}"
    volumes:
      - dag_viz_data:/app/data
    depends_on:
      - validator-1
    restart: on-failure

  # DAG visualizer frontend — static SPA
  dag-visualizer-frontend:
    image: iotaledger/dag-visualizer-frontend
    build:
      context: ../dag-visualizer/frontend
    container_name: dag-visualizer-frontend
    hostname: dag-visualizer-frontend
    networks:
      iota-network:
        ipv4_address: 10.0.0.51
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dag-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.dag-frontend.entrypoints=web"
      - "traefik.http.routers.dag-frontend.priority=1"
      - "traefik.http.services.dag-frontend.loadbalancer.server.port=5173"
    depends_on:
      - dag-visualizer-server

  # Traefik reverse proxy — routes /api to server, / to frontend
  dag-viz-traefik:
    image: traefik:v3.6
    container_name: dag-viz-traefik
    hostname: dag-viz-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=iota-private-network_iota-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "${DAG_VIZ_PORT:-80}:80"
    networks:
      iota-network:
        ipv4_address: 10.0.0.52
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - dag-visualizer-server
      - dag-visualizer-frontend

volumes:
  dag_viz_data:
