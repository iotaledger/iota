x-common-validator: &common-validator
  image: iotaledger/iota-node
  environment: &common-env
    - RUST_BACKTRACE=1
    - RUST_LOG=${IOTA_NODE_RUST_LOG:-info,iota_core=debug,iota_network=debug,iota_node=debug,jsonrpsee=error}
    - RPC_WORKER_THREAD=12
    - NEW_CHECKPOINT_WARNING_TIMEOUT_MS=30000
    - NEW_CHECKPOINT_PANIC_TIMEOUT_MS=60000
    # TODO: Remove these overrides once P-COOL flow is enabled by default in the protocol config on develop.
    - IOTA_PROTOCOL_CONFIG_OVERRIDE_ENABLE=${IOTA_PROTOCOL_CONFIG_OVERRIDE_ENABLE:-0}
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_ENABLE_PCOOL_FLOW=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_ENABLE_PCOOL_FLOW:-false}
    # enable/disable validator attestation
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_ENABLE_VALIDATOR_ATTESTATION=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_ENABLE_VALIDATOR_ATTESTATION:-false}
    # sequencer-related feature flags and protocol config parameters
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_PER_OBJECT_CONGESTION_CONTROL_MODE=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_PER_OBJECT_CONGESTION_CONTROL_MODE:-TotalTxCount}
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_CONGESTION_CONTROL_MIN_FREE_EXECUTION_SLOT=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_CONGESTION_CONTROL_MIN_FREE_EXECUTION_SLOT:-true}
    - IOTA_PROTOCOL_CONFIG_OVERRIDE_MAX_ACCUMULATED_TXN_COST_PER_OBJECT_IN_MYSTICETI_COMMIT
    - IOTA_PROTOCOL_CONFIG_OVERRIDE_MAX_CONGESTION_LIMIT_OVERSHOOT_PER_COMMIT
    - IOTA_PROTOCOL_CONFIG_OVERRIDE_MAX_DEFERRAL_ROUNDS_FOR_CONGESTION_CONTROL
    # gas-price-feedback-related feature flags and protocol config parameters
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_CONGESTION_CONTROL_GAS_PRICE_FEEDBACK_MECHANISM=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_CONGESTION_CONTROL_GAS_PRICE_FEEDBACK_MECHANISM:-true}
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_CONGESTION_LIMIT_OVERSHOOT_IN_GAS_PRICE_FEEDBACK_MECHANISM=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_CONGESTION_LIMIT_OVERSHOOT_IN_GAS_PRICE_FEEDBACK_MECHANISM:-true}
    - IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_SEPARATE_GAS_PRICE_FEEDBACK_MECHANISM_FOR_RANDOMNESS=${IOTA_PROTOCOL_CONFIG_FEATURE_FLAGS_OVERRIDE_SEPARATE_GAS_PRICE_FEEDBACK_MECHANISM_FOR_RANDOMNESS:-true}
    # Expose all metrics in a private network for full observability. `trace`
    # is the most permissive threshold, and being set here it also overrides
    # any stricter directive coming from the node config.
    - METRICS_FILTER=${METRICS_FILTER:-trace}
  command: &common-command [
    "/usr/local/bin/iota-node",
    "--config-path",
    "/opt/iota/config/validator.yaml",
  ]
  restart: on-failure
  logging: &common-logging
    driver: "json-file"
    options:
      max-file: "10"
      max-size: "1g"

x-common-fullnode: &common-fullnode
  <<: *common-validator
  command:
    [
      "/usr/local/bin/iota-node",
      "--config-path",
      "/opt/iota/config/fullnode.yaml",
    ]

services:
  # The validator services below are GENERATED by gen-topology.sh from the
  # validator count (-n N); everything between the two markers is overwritten on
  # each bootstrap and must not be hand-edited. Validators are statically
  # addressed 10.0.0.(10+i); the fixed infra (fullnodes, indexers, faucet,
  # postgres) lives at 10.0.0.201+ so it never collides for N up to ~190.
  # BEGIN generated validators
  validator-1:
    <<: *common-validator
    container_name: validator-1
    hostname: validator-1
    networks:
      iota-network:
        ipv4_address: 10.0.0.11
    volumes:
      - ./configs/validators/validator-1-8080.yaml:/opt/iota/config/validator.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
      - ./data/validator-1:/opt/iota/db:rw
    # Temporary: exposes the validator gRPC port to the host so a direct
    # (non-fullnode) benchmark client can reach it for the soft-lock probe.
    ports:
      - "127.0.0.1:18080:8080/tcp"

  validator-2:
    <<: *common-validator
    container_name: validator-2
    hostname: validator-2
    networks:
      iota-network:
        ipv4_address: 10.0.0.12
    volumes:
      - ./configs/validators/validator-2-8080.yaml:/opt/iota/config/validator.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
      - ./data/validator-2:/opt/iota/db:rw

  validator-3:
    <<: *common-validator
    container_name: validator-3
    hostname: validator-3
    networks:
      iota-network:
        ipv4_address: 10.0.0.13
    volumes:
      - ./configs/validators/validator-3-8080.yaml:/opt/iota/config/validator.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
      - ./data/validator-3:/opt/iota/db:rw

  validator-4:
    <<: *common-validator
    container_name: validator-4
    hostname: validator-4
    networks:
      iota-network:
        ipv4_address: 10.0.0.14
    volumes:
      - ./configs/validators/validator-4-8080.yaml:/opt/iota/config/validator.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
      - ./data/validator-4:/opt/iota/db:rw

  # END generated validators

  fullnode-1:
    <<: *common-fullnode
    container_name: fullnode-1
    hostname: fullnode-1
    networks:
      iota-network:
        ipv4_address: 10.0.0.201
    volumes:
      - ./data/fullnode-1:/opt/iota/db:rw
      - ./configs/fullnodes/fullnode.yaml:/opt/iota/config/fullnode.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
    expose:
      - "9000"
      - "50051"
    ports:
      - "127.0.0.1:9000:9000/tcp"
      - "127.0.0.1:9184:9184/tcp"
      - "127.0.0.1:50051:50051/tcp"

  fullnode-2:
    <<: *common-fullnode
    container_name: fullnode-2
    hostname: fullnode-2
    networks:
      iota-network:
        ipv4_address: 10.0.0.202
    volumes:
      - ./data/fullnode-2:/opt/iota/db:rw
      - ./configs/fullnodes/backup.yaml:/opt/iota/config/fullnode.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
    ports:
      - "127.0.0.1:9001:9000/tcp"
      - "127.0.0.1:9185:9184/tcp"

  fullnode-3:
    <<: *common-fullnode
    container_name: fullnode-3
    hostname: fullnode-3
    networks:
      iota-network:
        ipv4_address: 10.0.0.203
    volumes:
      - ./data/fullnode-3:/opt/iota/db:rw
      - ./configs/fullnodes/fullnode.yaml:/opt/iota/config/fullnode.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
    ports:
      - "127.0.0.1:9002:9000/tcp"
      - "127.0.0.1:9186:9184/tcp"

  fullnode-4:
    <<: *common-fullnode
    container_name: fullnode-4
    hostname: fullnode-4
    networks:
      iota-network:
        ipv4_address: 10.0.0.204
    volumes:
      - ./data/fullnode-4:/opt/iota/db:rw
      - ./configs/fullnodes/fullnode.yaml:/opt/iota/config/fullnode.yaml:ro
      - ./configs/genesis/genesis.blob:/opt/iota/config/genesis.blob:ro
    ports:
      - "127.0.0.1:9003:9000/tcp"
      - "127.0.0.1:9187:9184/tcp"

  indexer-1:
    image: iotaledger/iota-indexer
    container_name: indexer-1
    hostname: indexer-1
    restart: on-failure
    networks:
      iota-network:
        ipv4_address: 10.0.0.205
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=info
      - RPC_WORKER_THREAD=12
    command:
      - /usr/local/bin/iota-indexer
      - --database-url=postgres://iota_indexer:iota_indexer@postgres_primary:5432/iota_indexer
      - --metrics-address=0.0.0.0:9181
      - indexer
      - --remote-store-url=http://fullnode-3:9000/api/v1
      - --reset-db
    ports:
      - "127.0.0.1:9004:9000/tcp"
      - "127.0.0.1:9181:9181/tcp"
    volumes:
      - ./data/indexer-1:/opt/iota
    depends_on:
      - fullnode-3
      - postgres_primary

  indexer-2:
    image: iotaledger/iota-indexer
    container_name: indexer-2
    hostname: indexer-2
    restart: on-failure
    networks:
      iota-network:
        ipv4_address: 10.0.0.206
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=info
      - RPC_WORKER_THREAD=12
    command:
      - /usr/local/bin/iota-indexer
      - --database-url=postgres://iota_indexer:iota_indexer@postgres_replica:5432/iota_indexer
      - --metrics-address=0.0.0.0:9181
      - json-rpc-service
      - --rpc-client-url=http://fullnode-4:9000
      - --rpc-address=0.0.0.0:9000
    ports:
      - "127.0.0.1:9005:9000/tcp"
      - "127.0.0.1:9182:9181/tcp"
    depends_on:
      - fullnode-4
      - postgres_replica
    volumes:
      - ./data/indexer-2:/opt/iota

  faucet-1:
    image: iotaledger/iota-tools
    container_name: faucet-1
    hostname: faucet-1
    restart: on-failure
    networks:
      iota-network:
        ipv4_address: 10.0.0.207
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=info
      - RPC_WORKER_THREAD=12
    command:
      - /usr/local/bin/iota-faucet
      - --port=5003
      - --host-ip=0.0.0.0
      - --write-ahead-log=/wal/faucet.wal
      - --num-coins=10
      - --amount=200000000000
      - --max-request-per-second=50
      - --ttl-expiration=150
    ports:
      - "127.0.0.1:5003:5003/tcp"
      - "127.0.0.1:9188:9184/tcp"
    volumes:
      - ./configs/faucet:/root/.iota/iota_config
      - ./data/faucet-1:/wal
    depends_on:
      - fullnode-1

  postgres_primary:
    image: postgres:15
    user: postgres
    restart: always
    container_name: postgres_primary
    hostname: postgres_primary
    networks:
      iota-network:
        ipv4_address: 10.0.0.208
    expose:
      - 5432
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: iota_indexer
      POSTGRES_PASSWORD: iota_indexer
      POSTGRES_DB: iota_indexer
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all 0.0.0.0/0 md5"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: |
      postgres
      -c wal_level=replica
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on
      -c 'max_connections=1000'
    volumes:
      - ./static/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/primary:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -p 5432"
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 10s

  postgres_replica:
    image: postgres:15
    user: postgres
    restart: always
    container_name: postgres_replica
    hostname: postgres_replica
    networks:
      iota-network:
        ipv4_address: 10.0.0.209
    expose:
      - 5432
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Initializing replica...'
        until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=postgres_primary --port=5432
        do
          echo 'Waiting for primary to connect...'
          sleep 1s
        done
        echo 'Backup done, starting replica...'
      else
        echo 'Existing data found, starting replica...'
      fi
      chmod 0700 /var/lib/postgresql/data
      postgres -c 'max_connections=1000'
      "
    depends_on:
      - postgres_primary
    volumes:
      - ./data/replica:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -p 5432"
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 10s

networks:
  iota-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
