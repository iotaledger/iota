services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure

  dag-mock-server:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./mock-server:/app:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=9186"
    command:
      - sh
      - -c
      - "pip install -q -r requirements.txt && exec python mock_server.py --port 9186 --validators ${VALIDATORS:-10} --miss-rate ${MISS_RATE:-0.05} --skip-rate ${SKIP_RATE:-0.15} --round-interval-ms ${ROUND_INTERVAL_MS:-55} --equivocation-rate ${EQUIVOCATION_RATE:-0.02} --stale-rate ${STALE_RATE:-0.08} --slow-round-rate ${SLOW_ROUND_RATE:-0.08} --epoch ${EPOCH:-1}"
    restart: on-failure

  dag-visualizer-frontend:
    build:
      context: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    depends_on:
      - dag-mock-server
