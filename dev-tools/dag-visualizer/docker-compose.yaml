services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure

  dag-visualizer-server:
    image: iotaledger/dag-visualizer-server
    build:
      context: ../../
      dockerfile: dev-tools/dag-visualizer/server/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=9186"
    volumes:
      - dag_viz_data:/app/data
    command:
      - "--validator-grpc-address=${VALIDATOR_GRPC_ADDRESS:-http://host.docker.internal:9185}"
      - "--webserver-address=0.0.0.0:9186"
      - "--data-dir=/app/data"
      - "--max-epochs=${MAX_EPOCHS:-2}"
      - "--log-level=${LOG_LEVEL:-info}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  dag-visualizer-frontend:
    image: iotaledger/dag-visualizer-frontend
    build:
      context: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    depends_on:
      - dag-visualizer-server

volumes:
  dag_viz_data:
