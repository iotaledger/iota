services:
  dag-visualizer:
    image: node:24-trixie
    working_dir: /app
    volumes:
      - .:/app
      - dag_viz_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://host.docker.internal:9186
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npx vite"

volumes:
  dag_viz_node_modules:
