global:
  # 1s for finer stress-test resolution. scrape_timeout must be <= scrape_interval
  # (default 10s would fail config validation at 1s). Bump both to 2s if the
  # node /metrics endpoint can't be served within 1s under load.
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  # The Validator_* scrape jobs below are GENERATED by
  # ../iota-private-network/gen-topology.sh from the validator count (-n N);
  # everything between the two markers is overwritten on each bootstrap and must
  # not be hand-edited.
  # BEGIN generated validator scrape jobs
  - job_name: "Validator_1"
    static_configs:
      - targets: ["validator-1:9184"]
        labels:
          host: validator-1
          network: local
  - job_name: "Validator_2"
    static_configs:
      - targets: ["validator-2:9184"]
        labels:
          host: validator-2
          network: local
  - job_name: "Validator_3"
    static_configs:
      - targets: ["validator-3:9184"]
        labels:
          host: validator-3
          network: local
  - job_name: "Validator_4"
    static_configs:
      - targets: ["validator-4:9184"]
        labels:
          host: validator-4
          network: local
  # END generated validator scrape jobs
  - job_name: "Fullnode_1"
    static_configs:
      - targets: ["fullnode-1:9184"]
        labels:
          host: fullnode-1
          network: local
  - job_name: "Fullnode_2"
    static_configs:
      - targets: ["fullnode-2:9184"]
        labels:
          host: fullnode-2
          network: local
  - job_name: "Fullnode_3"
    static_configs:
      - targets: ["fullnode-3:9184"]
        labels:
          host: fullnode-3
          network: local
  - job_name: "Fullnode_4"
    static_configs:
      - targets: ["fullnode-4:9184"]
        labels:
          host: fullnode-4
          network: local
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: node
          network: local
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          network: local
