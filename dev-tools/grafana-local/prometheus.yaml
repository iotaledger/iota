global:
  # 1s for finer stress-test resolution. scrape_timeout must be <= scrape_interval
  # (default 10s would fail config validation at 1s). Bump both to 2s if the
  # node /metrics endpoint can't be served within 1s under load.
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  # Validator_1 … Validator_100, hardcoded. Only validator-1 … -N are running
  # (per run.sh -n N); the rest show as "down" targets — cosmetic.
  - job_name: "Validator_1"
    static_configs:
      - targets: ["validator-1:9184"]
        labels:
          host: validator-1
          network: local
  - job_name: "Validator_2"
