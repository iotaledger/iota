services:
  iota-names-indexer:
    container_name: iota-names-indexer
    depends_on:
      prometheus:
        condition: service_started
    build:
      context: ../..
      dockerfile: docker/iota-names-indexer/Dockerfile
      args:
        - GIT_REVISION
        - BUILD_DATE
        - PROFILE=dev
    image: iota-names-indexer:dev
    ports:
      - "9184:9184/tcp" # Metrics
    tty: true
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "65532"
    ports:
      - 9090:9090
    volumes:
      - prometheus_data:/prometheus
      - ./assets/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=http://localhost:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    user: "65532"
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./assets/grafana/:/etc/grafana/provisioning/

volumes:
  prometheus_data:
  grafana_data:
