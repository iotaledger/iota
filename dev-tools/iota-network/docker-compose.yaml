version: "3"

services:
  validator1:
    networks:
      iota-network:
        ipv4_address: 10.0.0.11
    image: iotaledger/iota-node:mainnet
    container_name: validator1
    hostname: validator1
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=info,iota_core=debug,iota_network=debug,iota_node=debug,jsonrpsee=error
      - RPC_WORKER_THREAD=12
      - NEW_CHECKPOINT_WARNING_TIMEOUT_MS=30000
      - NEW_CHECKPOINT_PANIC_TIMEOUT_MS=60000
    volumes:
      - ./genesis/files/validator1-8080.yaml:/opt/iota/config/validator.yaml:ro
      - ./genesis/files/genesis.blob:/opt/iota/config/genesis.blob:ro
      - /tmp/iota/db1:/opt/iota/db:rw
    command:
      [
        "/usr/local/bin/iota-node",
        "--config-path",
        "/opt/iota/config/validator.yaml",
      ]
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "1g"
