[package]
name = "custom-indexer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# external dependencies
anyhow = "1.0"
async-trait = "0.1"
tokio = "1.49.0"

# internal dependencies
iota-data-ingestion-core = { path = "../../../crates/iota-data-ingestion-core" }
iota-types = { path = "../../../crates/iota-types" }
prometheus-filtered = { path = "../../../crates/prometheus-filtered" }

[[bin]]
name = "local_reader"
path = "local_reader.rs"

[[bin]]
name = "remote_reader"
path = "remote_reader.rs"

[[bin]]
name = "hybrid_reader"
path = "hybrid_reader.rs"

[[bin]]
name = "remote_reader_with_filters"
path = "remote_reader_with_filters.rs"

# fastcrypto-tbls/-vdf/-zkp (pulled transitively via the monorepo crates) fetch
# fastcrypto through an in-repo path dep. Redirect it to the crates.io release
# so this workspace shares a single fastcrypto instead of two conflicting copies.
[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"
