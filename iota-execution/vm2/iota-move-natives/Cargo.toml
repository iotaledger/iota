bcs.workspace = true
better_any.workspace = true
fastcrypto.workspace = true
fastcrypto-vdf.workspace = true
fastcrypto-zkp.workspace = true
indexmap.workspace = true
rand.workspace = true
rand08.workspace = true
serde.workspace = true
smallvec.workspace = true
tracing.workspace = true

# internal dependencies
iota-protocol-config.workspace = true
iota-sdk-move-types.workspace = true
iota-sdk-types.workspace = true
iota-types.workspace = true
move-binary-format.workspace = true
move-core-types.workspace = true
move-vm-runtime = { path = "../../../external-crates/move/move-execution/vm2/crates/move-vm-runtime", package = "move-vm-runtime-vm2" }

[features]
tracing = ["move-vm-runtime/tracing"]
