[package]
name = "iota-adapter-vm2"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
description = "Adapter and accompanying CLI for local iota development"
license = "Apache-2.0"
publish = false
edition = "2024"

[lints]
workspace = true

[dependencies]
# external dependencies
anyhow = { workspace = true, features = ["backtrace"] }
bcs.workspace = true
either.workspace = true
fastcrypto.workspace = true
indexmap.workspace = true
leb128.workspace = true
nonempty.workspace = true
parking_lot.workspace = true
quick_cache.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# internal dependencies
iota-common.workspace = true
iota-macros.workspace = true
iota-metrics.workspace = true
iota-move-natives = { path = "../iota-move-natives", package = "iota-move-natives-vm2" }
iota-protocol-config.workspace = true
iota-sdk-move-types.workspace = true
iota-sdk-types.workspace = true
iota-types.workspace = true
iota-verifier = { path = "../iota-verifier", package = "iota-verifier-vm2" }
move-binary-format.workspace = true
move-bytecode-utils.workspace = true
move-bytecode-verifier = { path = "../../../external-crates/move/move-execution/vm2/crates/move-bytecode-verifier", package = "move-bytecode-verifier-vm2" }
move-bytecode-verifier-meter.workspace = true
move-core-types.workspace = true
move-regex-borrow-graph = { path = "../../../external-crates/move/move-execution/vm2/crates/move-regex-borrow-graph", package = "move-regex-borrow-graph-vm2" }
move-trace-format.workspace = true
move-vm-config.workspace = true
move-vm-profiler = { path = "../../../external-crates/move/crates/move-vm-profiler" }
move-vm-runtime = { path = "../../../external-crates/move/move-execution/vm2/crates/move-vm-runtime", package = "move-vm-runtime-vm2" }

[dev-dependencies]
iota-framework.workspace = true
prometheus.workspace = true
tokio.workspace = true

[features]
tracing = [
  "iota-types/tracing",
  "move-vm-config/tracing",
  "move-vm-profiler/tracing",
  "move-vm-runtime/tracing",
]
