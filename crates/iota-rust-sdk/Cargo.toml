[package]
name = "iota-rust-sdk"
version.workspace = true
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
rust-sdk.workspace = true

[features]
default = [
  "bech32",
  "crypto",
  "ed25519",
  "graphql",
  "hash",
  "mnemonic",
  "passkey",
  "pem",
  "rand",
  "secp256k1",
  "secp256r1",
  "serde",
  "transaction-builder",
  "types",
]
# Crypto
crypto = ["rust-sdk/crypto"]
ed25519 = ["crypto", "rust-sdk/ed25519"]
secp256r1 = ["crypto", "rust-sdk/secp256r1"]
passkey = ["crypto", "rust-sdk/passkey"]
secp256k1 = ["crypto", "rust-sdk/secp256k1"]
pem = ["crypto", "rust-sdk/pem"]
bls12381 = ["crypto", "rust-sdk/bls12381"]
bech32 = ["crypto", "rust-sdk/bech32"]
mnemonic = ["crypto", "rust-sdk/mnemonic"]
# GraphQL
graphql = ["rust-sdk/graphql-tls-ring"]
# gRPC
grpc = ["rust-sdk/grpc-tls-native-roots", "rust-sdk/grpc-tls-ring"]
# Transaction Builder
transaction-builder = ["rust-sdk/transaction-builder"]
# Types
types = ["rust-sdk/types"]
serde = ["types", "rust-sdk/serde"]
rand = ["types", "rust-sdk/rand"]
hash = ["types", "rust-sdk/hash"]
proptest = ["types", "rust-sdk/proptest"]
