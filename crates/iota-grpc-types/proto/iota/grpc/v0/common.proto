syntax = "proto3";

package iota.grpc.v0.common;

// ============================================================================
// Core primitive types
// ============================================================================

// BCS-serialized data container
message BcsData {
  bytes data = 1;
}

// 32-byte address type for IOTA addresses, object IDs, package IDs, etc.
message Address {
  bytes address = 1;
}

// Generic 32-byte digest (used for transactions, objects, etc.)
message Digest {
  bytes digest = 1;
}

// Container for the BcsData and the name of the type
message Bcs {
  // Name that identifies the type of the serialized value.
  string name = 1;

  // The BCS-serialized data.
  BcsData value = 2;
}

// ============================================================================
// Object-related types
// ============================================================================

// Object reference
message ObjectRef {
  Address object_id = 1;
  uint64 version = 2;
  Digest digest = 3;
}

// Owner types
message Owner {
  oneof owner {
    Address address_owner = 1;
    Address object_owner = 2;
    SharedOwner shared = 3;
    ImmutableOwner immutable = 4;
  }
}

message SharedOwner {
  uint64 initial_shared_version = 1;
}

message ImmutableOwner {}

// ============================================================================
// Filter types (for events and queries)
// ============================================================================

// Match all events (catch-all filter)
message AllFilter {
}

// Filter by address (sender, package, etc.)
message AddressFilter {
  Address address = 1;
}

// Filter by transaction digest
message TransactionDigestFilter {
  Digest tx_digest = 1;
}

// Filter by Move module (package + module)
message MoveModuleFilter {
  Address package_id = 1;         // Package ID
  string module = 2;              // Module name
}

// Filter by Move event type (package + module + event name)
message MoveEventTypeFilter {
  Address package_id = 1;         // Package ID
  string module = 2;              // Module name
  string name = 3;                // Event name
}

// Filter by Move event module (package + module)
message MoveEventModuleFilter {
  Address package_id = 1;         // Package ID
  string module = 2;              // Module name
}

// Filter by Move function (package + module + function)
message MoveFunctionFilter {
  Address package_id = 1;         // Package ID
  optional string module = 2;     // Module name (optional)
  optional string function = 3;   // Function name (optional)
}

// ============================================================================
// Transaction-related types
// ============================================================================

// Gas data for transactions
message GasData {
  // Payment objects
  repeated ObjectRef payment = 1;
  // Gas owner
  Address owner = 2;
  // Gas price
  uint64 price = 3;
  // Gas budget
  uint64 budget = 4;
}

// Finality information
message EffectsFinality {
  oneof finality {
    // BCS-encoded iota_types::crypto::AuthorityStrongQuorumSignInfo
    Bcs certified_signature = 1;
    uint64 checkpointed = 2;
  }
}

// ============================================================================
// Object and balance change types
// ============================================================================

// ObjectChange represents changes to objects during transaction execution
message ObjectChange {
  oneof change {
    ObjectPublished published = 1;
    ObjectTransferred transferred = 2;
    ObjectMutated mutated = 3;
    ObjectDeleted deleted = 4;
    ObjectWrapped wrapped = 5;
    ObjectCreated created = 6;
  }
}

message ObjectPublished {
  Address package_id = 1;
  uint64 version = 2;
  Digest digest = 3;
  repeated string modules = 4;
}

message ObjectTransferred {
  Address sender = 1;
  Owner recipient = 2;
  string object_type = 3;  // StructTag as string
  Address object_id = 4;
  uint64 version = 5;
  Digest digest = 6;
}

message ObjectMutated {
  Address sender = 1;
  Owner owner = 2;
  string object_type = 3;  // StructTag as string
  Address object_id = 4;
  uint64 version = 5;
  uint64 previous_version = 6;
  Digest digest = 7;
}

message ObjectDeleted {
  Address sender = 1;
  string object_type = 2;  // StructTag as string
  Address object_id = 3;
  uint64 version = 4;
}

message ObjectWrapped {
  Address sender = 1;
  string object_type = 2;  // StructTag as string
  Address object_id = 3;
  uint64 version = 4;
}

message ObjectCreated {
  Address sender = 1;
  Owner owner = 2;
  string object_type = 3;  // StructTag as string
  Address object_id = 4;
  uint64 version = 5;
  Digest digest = 6;
}

// BalanceChange represents balance changes during transaction execution
message BalanceChange {
  // Owner of the balance change
  Owner owner = 1;
  // Type of the Coin
  string coin_type = 2;
  // Amount as string to support i128 (can be negative)
  // Format: decimal string representation of i128
  string amount = 3;
}

// ============================================================================
// Event-related types
// ============================================================================

// Event represents a transaction event
message Event {
  EventID event_id = 1;
  Address package_id = 2;
  string transaction_module = 3;
  Address sender = 4;
  string type_name = 5;
  optional uint64 timestamp_ms = 6;
  Bcs event_data = 7;  // BCS-encoded event data, name should be the event type from type_name, or we remove type_name? (To discuss)
}

// Event identifier
message EventID {
  uint64 event_seq = 1;
  Digest tx_digest = 2;
}

// ============================================================================
// Coin-related types
// ============================================================================

// Coin information for individual coin objects
message CoinInfo {
  // Coin type as TypeTag string (e.g., "0x2::iota::IOTA")
  string coin_type = 1;

  // Object reference (ID + version + digest)
  ObjectRef object_ref = 2;

  // Balance value extracted for convenience (avoids BCS deserialization)
  uint64 balance = 3;

  /// BCS-encoded iota_types::object::Object
  Bcs object = 4;
}

// Balance information aggregated across all coin objects of a type
message BalanceInfo {
  // Coin type as TypeTag string (e.g., "0x2::iota::IOTA")
  string coin_type = 1;

  // Number of coin objects owned (each returned by GetCoins)
  uint64 coin_object_count = 2;

  // Total balance across all coin objects (as string to support u128)
  // Sum of all individual coin balances for this coin type
  string total_balance = 3;
}
