syntax = "proto3";

package iota.grpc.v0.governance;

import "common.proto";

// Governance service provides access to validator and system state information
// such as validator sets, staking data, and gas prices.
service GovernanceService {
  // Get the latest IOTA system state
  rpc GetLatestIotaSystemState (GetLatestIotaSystemStateRequest) returns (GetLatestIotaSystemStateResponse);

  // Get the reference gas price for the network
  rpc GetReferenceGasPrice (GetReferenceGasPriceRequest) returns (GetReferenceGasPriceResponse);
}

// GetLatestIotaSystemState - Return the latest IOTA system state
message GetLatestIotaSystemStateRequest {
  // No parameters
}

message GetLatestIotaSystemStateResponse {
  // BCS-encoded iota-types::iota_system_state_summary::IotaSystemStateSummary
  iota.grpc.v0.common.Bcs system_state_summary = 1;
}

// GetReferenceGasPrice - Return the reference gas price for the network
message GetReferenceGasPriceRequest {
  // No parameters
}

message GetReferenceGasPriceResponse {
  // Reference gas price
  uint64 gas_price = 1;
}
