# The node-parity test drives iota-vm-sdk's gRPC store, which needs a real
# multi-threaded runtime, so it does not run under the simulator. Confining the
# dependency to non-msim keeps iota-vm-sdk's native-only gRPC stack out of the
# simtest build.
[target.'cfg(not(msim))'.dev-dependencies]
iota-vm-sdk = { workspace = true, features = ["grpc"] }
