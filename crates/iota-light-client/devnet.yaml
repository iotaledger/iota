rpc_url: "https://api.devnet.iota.cafe"
graphql_url: "https://graphql.devnet.iota.cafe"
# Provide an existing directory that contains the genesis file of the devnet
# You can download it from `https://dbfiles.devnet.iota.cafe/genesis.blob`
checkpoints_dir: "checkpoints_devnet"
sync_before_check: false
# TODO switch to this endpoint once available
#object_store_url: "https://checkpoints.devnet.iota.cafe"
object_store_url: ~
archive_store_config:
  object-store: "S3"
  aws-endpoint: "https://archive.devnet.iota.cafe"
  aws-virtual-hosted-style-request: true
  no-sign-request: true
  aws-region: "weur"
  object-store-connection-limit: 20
