rpc_url: "https://api.testnet.iota.cafe"
graphql_url: "https://graphql.testnet.iota.cafe"
# Provide an existing directory that contains the genesis file of the testnet
# You can download it from `https://dbfiles.testnet.iota.cafe/genesis.blob`
checkpoints_dir: "checkpoints_testnet"
sync_before_check: false
# TODO switch to this endpoint once available
#object_store_url: "https://checkpoints.testnet.iota.cafe"
object_store_url: ~
archive_store_config:
  object-store: "S3"
  aws-endpoint: "https://archive.testnet.iota.cafe"
  no-sign-request: true
  aws-region: "weur"
  object-store-connection-limit: 20
