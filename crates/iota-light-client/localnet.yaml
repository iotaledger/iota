rpc_url: "http://localhost:9000"
graphql_url: "http://localhost:9125"
# Provide an existing directory that contains the genesis file of the localnet
checkpoints_dir: "checkpoints_localnet"
sync_before_check: false
object_store_url: ~
archive_store_config:
  object-store: "S3"
  bucket: "your-bucket-name"
  aws-endpoint: "https://your-object-store-domain"
  aws-virtual-hosted-style-request: false
  no-sign-request: true
  aws-region: "your-object-store-region"
  object-store-connection-limit: 20
