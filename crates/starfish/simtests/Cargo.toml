[package]
name = "starfish-simtests"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

# The crate's code is entirely `#[cfg(msim)]`-gated, so all dependencies are
# only used under the simulator. Keeping them target-scoped means the non-msim
# `cargo udeps` build sees no active deps and doesn't flag them as unused.
[target.'cfg(msim)'.dependencies]
# external dependencies
arc-swap.workspace = true
eyre.workspace = true
parking_lot.workspace = true
rand.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

# internal dependencies
iota-config.workspace = true
iota-macros.workspace = true
iota-metrics.workspace = true
iota-network-stack.workspace = true
iota-protocol-config.workspace = true
iota-simulator.workspace = true
prometheus-filtered.workspace = true
starfish-config.workspace = true
starfish-core.workspace = true
telemetry-subscribers.workspace = true
typed-store.workspace = true
