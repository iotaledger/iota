# internal dependencies

# optional dependencies
instant = { version = "0.1.12", default-features = false, optional = true }
rand = { version = "0.8.5", default-features = false, features = ["min_const_gen"], optional = true }
regex = { version = "1.10.3", default-features = false, features = ["unicode-perl"], optional = true }
serde_repr = { version = "0.1.18", default-features = false, optional = true }
zeroize = { version = "1.7.0", default-features = false, features = ["zeroize_derive"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
instant = { version = "0.1.12", default-features = false, features = ["wasm-bindgen"], optional = true }

[dev-dependencies]
pretty_assertions = { version = "1.4.0", default-features = false, features = ["alloc"] }

[features]
default = ["std", "serde"]
irc_27 = ["url", "serde"]
irc_30 = ["url", "serde"]
serde = [
  "serde_repr",
  "hashbrown/serde",
  "packable/serde",
  "primitive-types/serde_no_std",
  "zeroize?/serde",
]
std = [
  "packable/std",
  "prefix-hex/std",
  "primitive-types/std",
  "bech32/std",
  "bitflags/std",
  "rand?/std_rng",
  "regex?/std",
  "iota-crypto/std",
]
