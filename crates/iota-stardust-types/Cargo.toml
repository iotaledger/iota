[package]
name = "iota-stardust-types"
version.workspace = true
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
# external dependencies
bech32 = { version = "0.9.1", default-features = false }
bitflags = { version = "2.4.2", default-features = false }
bytemuck = { version = "1.14.3", default-features = false }
derive_more = { version = "0.99.17", default-features = false, features = ["from", "as_ref", "deref", "deref_mut", "display"] }
getset = { version = "0.1.2", default-features = false }
hashbrown = { version = "0.14.3", default-features = false, features = ["ahash", "inline-more"] }
hex = { version = "0.4.3", default-features = false }
iota-crypto = { version = "0.23.2", default-features = false, features = ["blake2b", "ed25519", "secp256k1", "ternary_encoding", "bip39", "bip39-en", "slip10"] }
iterator-sorted = { version = "0.2.0", default-features = false }
packable = { version = "0.8.3", default-features = false, features = ["primitive-types"] }
prefix-hex = { version = "0.7.1", default-features = false, features = ["primitive-types"] }
primitive-types = { version = "0.12.2", default-features = false }
serde = { version = "1.0.196", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.113", default-features = false, features = ["alloc"] }
url = { version = "2.5.0", default-features = false, features = ["serde"], optional = true }
