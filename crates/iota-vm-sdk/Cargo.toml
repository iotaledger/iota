[package]
name = "iota-vm-sdk"
version.workspace = true
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Local IOTA Move VM SDK: decode, store, execute and introspect transactions locally."

[features]
default = []
grpc = ["dep:tonic", "dep:iota-grpc-client", "dep:iota-grpc-types"]
graphql = ["dep:chrono", "dep:reqwest", "dep:iota-graphql-rpc-client"]

[dependencies]
# external dependencies
base64.workspace = true
bcs.workspace = true
chrono = { workspace = true, optional = true }
fastcrypto.workspace = true
prometheus.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tonic = { workspace = true, optional = true }

# internal dependencies
iota-config.workspace = true
iota-execution = { workspace = true, features = ["tracing"] }
iota-framework.workspace = true
iota-graphql-rpc-client = { workspace = true, optional = true }
iota-grpc-client = { workspace = true, optional = true }
iota-grpc-types = { workspace = true, optional = true }
iota-protocol-config.workspace = true
iota-sdk-types.workspace = true
iota-transaction-checks.workspace = true
iota-types.workspace = true
move-binary-format.workspace = true
move-bytecode-utils.workspace = true
move-core-types.workspace = true
move-trace-format.workspace = true

[dev-dependencies]
# external dependencies
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# internal dependencies
iota-json-rpc-types.workspace = true
iota-test-transaction-builder.workspace = true
test-cluster.workspace = true

[[example]]
name = "offline_dev_inspect"
path = "examples/offline_dev_inspect.rs"

[[test]]
name = "e2e_comparison"
path = "tests/e2e_comparison.rs"
required-features = ["grpc"]

[package.metadata.cargo-udeps.ignore]
development = [
  "iota-json-rpc-types",
  "iota-test-transaction-builder",
  "test-cluster",
]

[lints]
workspace = true
