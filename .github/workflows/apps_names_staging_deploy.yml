name: Staging Deploy for IOTA Names

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/names/**"
      - "sdk/names/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/apps_names_staging_deploy.yml"
      - ".github/workflows/_apps_names_vercel_deploy.yml"

jobs:
  deploy-staging:
    uses: ./.github/workflows/_apps_names_vercel_deploy.yml
    with:
      VERCEL_ENVIRONMENT: preview
      NAMES_DAPP_DEFAULT_NETWORK: devnet
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.IOTA_NAMES_VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      NAMES_DAPP_CONFIG: ${{ secrets.NAMES_DAPP_CONFIG }}
      VERCEL_ALIAS: ${{ secrets.NAMES_DAPP_STAGING_ALIAS }}
      NAMES_DAPP_FORBIDDEN_LIST: ${{ secrets.NAMES_DAPP_FORBIDDEN_LIST }}
