name: Rust

on:
  workflow_call:
    inputs:
      isRust:
        type: boolean
      isRustWorkspaceConfig:
        type: boolean
        default: false
      isRustExample:
        type: boolean
      isPgIntegration:
        type: boolean
      isMoveExampleUsedByOthers:
        type: boolean
      isNightly:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: "error"
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTDOCFLAGS: -D warnings

jobs:
  rust-lints:
    uses: ./.github/workflows/_rust_lints.yml
    if: (!cancelled() && !failure())
    with:
      isRust: ${{ inputs.isRust }}
      isRustExample: ${{ inputs.isRustExample }}
      isNightly: ${{ inputs.isNightly }}

  # Only feeds rust-tests, which doesn't run on pull_request events (below).
  crates-changes:
    needs: rust-lints
    if: (!cancelled() && !failure() && github.event_name != 'pull_request')
    runs-on: [self-hosted-x64]
    outputs:
      components: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          list-files: "json"
          filters: .github/crates-filters.yml

  # Only feeds rust-tests, which doesn't run on pull_request events (below).
  external-changes:
    needs: rust-lints
    runs-on: [self-hosted-x64]
    if: (!cancelled() && !failure() && github.event_name != 'pull_request')
    outputs:
      components: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          list-files: "json"
          filters: .github/external-crates-filters.yml

  # Heavy chain (tests + simtests): not on pull_request events — PRs get
  # these in the merge queue (merge_group) via `heavy-tests-status` in
  # hierarchy.yml. Pushes to long-lived branches are unchanged; nightly
  # calls _rust_tests.yml directly and is unaffected.
  rust-tests:
    if: (!cancelled() && !failure() && github.event_name != 'pull_request' && (inputs.isRust || inputs.isPgIntegration || inputs.isMoveExampleUsedByOthers))
    needs:
      - crates-changes
      - external-changes
    uses: ./.github/workflows/_rust_tests.yml
    with:
      isRust: ${{ inputs.isRust }}
      isPgIntegration: ${{ inputs.isPgIntegration }}
      isMoveExampleUsedByOthers: ${{ inputs.isMoveExampleUsedByOthers }}
      runSimtest: true
      # Only test changed crates and their dependent crates if there were no workspace-level config changes,
      # otherwise test all crates since workspace-level config changes can affect all crates.
      testOnlyChangedCrates: ${{ !inputs.isRustWorkspaceConfig }}
      changedCrates: ${{ join(fromJson(needs.crates-changes.outputs.components || '[]'), ' ') }}
      changedExternalCrates: ${{ join(fromJson(needs.external-changes.outputs.components || '[]'), ' ') }}
      isNightly: ${{ inputs.isNightly }}

  execution-cut:
    if: (!cancelled() && !failure() && inputs.isRust)
    needs:
      - rust-lints
    uses: ./.github/workflows/_execution_cut.yml
    with:
      isNightly: ${{ inputs.isNightly }}
