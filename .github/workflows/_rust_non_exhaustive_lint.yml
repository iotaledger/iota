name: Non-exhaustive enum drift

on:
  workflow_call:
    inputs:
      isRustWorkspaceConfig:
        type: boolean
        default: false
      isNightly:
        type: boolean
        default: false
  # Allow running the check on demand against any branch (in addition to the
  # workspace-config and nightly triggers below).
  workflow_dispatch:

concurrency:
  group: non-exhaustive-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  non-exhaustive-omitted-patterns:
    name: SDK enum variants hidden behind wildcard arms
    # An SDK enum gains variants only when the pinned rev moves, which is a
    # workspace-config change; the nightly run covers matches written in between.
    # workflow_dispatch runs it on demand regardless of those inputs.
    if: (!cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || inputs.isRustWorkspaceConfig || inputs.isNightly))
    runs-on: [self-hosted-x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Coverage is derived from `cargo tree` (every crate reaching iota-sdk-types
      # in its dependency tree) and the unstable lint is injected through a
      # RUSTC_WORKSPACE_WRAPPER, so no crate source carries the attribute. This is
      # a report: findings are warnings and never fail the job; the script fails
      # only its self-test, i.e. if the lint has stopped being applied at all.
      - name: Report SDK enum variants hidden behind wildcard arms
        run: scripts/non_exhaustive_lint/check.sh
        env:
          # Build in a fresh per-run target dir so every in-scope crate is
          # compiled with the lint injected. A shared/persistent target dir would
          # replay cached artifacts from before a crate entered scope (the wrapper
          # decision is not part of cargo's fingerprint), silently under-reporting.
          CARGO_TARGET_DIR: ${{ runner.temp }}/nelint-target
          # report.md and the full compiler output, for the artifact below. The
          # report also lands on the run's summary page via GITHUB_STEP_SUMMARY.
          NELINT_OUT_DIR: ${{ runner.temp }}/nelint-report

      - name: Upload report and compiler output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: non-exhaustive-lint-report
          path: ${{ runner.temp }}/nelint-report
          if-no-files-found: ignore
