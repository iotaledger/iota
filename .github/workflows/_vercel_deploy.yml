name: Vercel Deploys

on:
  workflow_call:
    inputs:
      isExplorer:
        type: boolean
        required: true
      isTypescriptSDK:
        type: boolean
        required: true
      isAppsBackend:
        type: boolean
        required: true
      isWalletDashboard:
        type: boolean
        required: true
      shouldDeployPreview:
        type: boolean
        required: true

concurrency:
  group: vercel-deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  explorer-preview:
    name: Vercel Explorer Preview
    if: inputs.shouldDeployPreview && inputs.isExplorer
    uses: ./.github/workflows/apps_explorer_deploy.yml
    secrets: inherit
    with:
      isProd: false
      isStaging: false

  explorer-staging:
    name: Vercel Explorer Staging
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/apps_explorer_deploy.yml
    secrets: inherit
    with:
      isProd: false
      isStaging: true

  wallet-dashboard-preview:
    name: Vercel Wallet Dashboard Preview
    if: inputs.shouldDeployPreview && inputs.isWalletDashboard
    uses: ./.github/workflows/apps_wallet_dashboard_deploy.yml
    secrets: inherit
    with:
      isProd: false
      isStaging: false

  wallet-dashboard-staging:
    name: Vercel Wallet Dashboard Staging
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/apps_wallet_dashboard_deploy.yml
    secrets: inherit
    with:
      isProd: false
      isStaging: true

  apps-backend-preview:
    name: Vercel apps-backend Preview
    if: inputs.shouldDeployPreview && inputs.isAppsBackend
    uses: ./.github/workflows/apps_backend_deploy.yml
    secrets: inherit
    with:
      isProd: false

  apps-backend-prod:
    name: Vercel apps-backend Production
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/apps_backend_deploy.yml
    secrets: inherit
    with:
      isProd: true
