[package]
name = "docs-examples"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# external dependencies
anyhow = "1.0"
fastcrypto = "=0.1.12"
hex = "0.4.3"
reqwest = { version = "0.13.1", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0"
tokio = "1.46.1"

# internal dependencies
iota-keys = { path = "../../../crates/iota-keys" }
iota-move-build = { path = "../../../crates/iota-move-build" }
iota-sdk = { path = "../../../crates/iota-sdk" }
iota-sdk-types = "1.0.0-rc.2"
iota-types = { path = "../../../crates/iota-types" }
move-binary-format = { path = "../../../external-crates/move/crates/move-binary-format", features = ["fuzzing"] }

[dev-dependencies]
# external dependencies
bcs = "0.1"
bip32 = "0.5"
serde_json = "1.0"
tokio = "1.49.0"

# internal dependencies
move-core-types = { path = "../../../external-crates/move/crates/move-core-types" }

# Stardust examples
[[example]]
name = "address-unlock-condition"
path = "stardust/address-unlock-condition.rs"

[[example]]
name = "nft-output-claim"
path = "stardust/nft-output-claim.rs"

[[example]]
name = "alias-output-claim"
path = "stardust/alias-output-claim.rs"

[[example]]
name = "basic-output-claim"
path = "stardust/basic-output-claim.rs"

[[example]]
name = "check-basic-output-unlock-conditions"
path = "stardust/check-basic-output-unlock-conditions.rs"

[[example]]
name = "alias-migration"
path = "stardust/alias-migration.rs"

[[example]]
name = "nft-migration"
path = "stardust/nft-migration.rs"

[[example]]
name = "foundry-output-claim"
path = "stardust/foundry-output-claim.rs"

[[example]]
name = "iota-self-sponsor"
path = "stardust/iota-self-sponsor.rs"

# Exchange examples
[[example]]
name = "derive-address"
path = "exchange/derive-address.rs"

[[example]]
name = "get-balance"
path = "exchange/get-balance.rs"

[[example]]
name = "authenticator-inputs-cryptographic-protection"
path = "abstract_account/authenticator-inputs-cryptographic-protection.rs"

[[example]]
name = "authenticator-shared-object-swap"
path = "abstract_account/authenticator-shared-object-swap.rs"

[[example]]
name = "authenticator-tx-data-cryptographic-protection"
path = "abstract_account/authenticator-tx-data-cryptographic-protection.rs"

[package.metadata.cargo-machete]
ignored = [
  "move-binary-format", # `serialize` method is gated by its `fuzzing` feature
]

[patch.crates-io]
iota-sdk-crypto = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-graphql-client = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-graphql-client-build = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-grpc-client = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-grpc-types = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-move-types = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-transaction-builder = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
iota-sdk-types = { git = "https://github.com/iotaledger/iota-rust-sdk", rev = "9228910c470c6f9d088f319ee379cda6bf5b62ce" }
